# PMKID Capture Tool Configuration
# WiFi Pineapple Nano Edition
# Enhanced by iNFINITEAi2025

# Default wireless interface
# Common options: wlan1, wlan1mon, wlan0
INTERFACE=wlan1

# Output directory for captures and logs
OUTPUT_DIR=/root/pmkid_captures

# Default capture timeout in seconds
# Recommended: 300-600 seconds for good results
TIMEOUT=300

# Verbose logging (0 = off, 1 = on)
# Enable for detailed debugging information
VERBOSE=0

# Auto-start on boot (0 = off, 1 = on)
# WARNING: Enable only in controlled environments
AUTO_START=0

# Maximum capture file size in MB (0 = unlimited)
MAX_FILE_SIZE=100

# Rotate logs after this many MB (0 = no rotation)
LOG_ROTATION_SIZE=10

# Keep this many old log files
LOG_KEEP_COUNT=5

# Target specific BSSID (leave empty for all)
# Example: TARGET_BSSID=AA:BB:CC:DD:EE:FF
TARGET_BSSID=

# Channel to monitor (0 = all channels)
# Set to specific channel for focused capture
TARGET_CHANNEL=0

# Enable deauth attack to speed up PMKID capture (0 = off, 1 = on)
# WARNING: Use only in authorized testing
ENABLE_DEAUTH=0

# Deauth packet count
DEAUTH_COUNT=5
